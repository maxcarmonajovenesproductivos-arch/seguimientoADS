<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento Operativo ADS</title>
  <style>
    :root {
      --gris: #6f737e;
      --vino: #6a3d5a;
      --fondo: #f4f4f9;
      --borde: #dcdce3;
      --alto-cabecera: 64px;
      --alto-pestanas: 52px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
      color: #222;
      display: flex;
      flex-direction: column;
    }

    /* Cabecera */
    .cabecera {
      height: var(--alto-cabecera);
      background: var(--gris);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .cabecera h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.4vw, 1.8rem);
      letter-spacing: 2px;
      font-weight: 600;
      text-align: center;
    }

    /* Pestañas */
    .barra {
      height: var(--alto-pestanas);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--borde);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .pestana {
      border: 1px solid var(--borde);
      background: #fff;
      color: #333;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .2s, color .2s, border-color .2s;
    }
    .pestana:hover { background: #ececf1; }
    .pestana[aria-selected="true"] {
      background: var(--vino);
      border-color: var(--vino);
      color: #fff;
    }
    .espacio { flex: 1; }
    .rotar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .rotar input { width: 16px; height: 16px; cursor: pointer; }
    .abrir {
      font-size: 0.85rem;
      color: var(--vino);
      text-decoration: none;
      white-space: nowrap;
      padding: 8px 4px;
    }
    .abrir:hover { text-decoration: underline; }

    /* Área de reportes: ocupa todo el alto restante de la pantalla */
    .contenido {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .panel {
      position: absolute;
      inset: 0;
    }
    .panel[hidden] { display: none; }
    /* TAMAÑO DEL REPORTE: 1 = normal, 0.85 = 85 %, 0.75 = 75 % ... */
    .panel { --zoom: 0.85; overflow: hidden; }
    .panel iframe {
      width: calc(100% / var(--zoom));
      height: calc(100% / var(--zoom));
      transform: scale(var(--zoom));
      transform-origin: top left;
      border: 0;
      display: block;
      background: #fff;
    }

    @media (max-width: 600px) {
      .rotar span { display: none; }
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <h1>SEGUIMIENTO OPERATIVO ADS</h1>
  </header>

  <nav class="barra" role="tablist" aria-label="Reportes">
    <!-- Para agregar un reporte: copia un botón y un panel, y cambia el número -->
    <button class="pestana" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true">Seguimiento Asistencia</button>
    <button class="pestana" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false">Sistema</button>

    <div class="espacio"></div>
    <label class="rotar" title="Cambia de reporte cada 60 segundos (útil en una TV)">
      <input type="checkbox" id="rotar"> <span>Rotar automáticamente</span>
    </label>
    <a class="abrir" id="abrir" href="#" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
  </nav>

  <main class="contenido">
    <section class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
      <iframe title="Seguimiento Asistencia"
        data-src="https://lookerstudio.google.com/embed/reporting/4d9f7781-034a-4571-80ff-809bfd6b452c/page/chuDG"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </section>
    <section class="panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>
      <iframe title="Sistema"
        data-src="https://script.google.com/macros/s/AKfycbxgyEsXkk9y_1YCSm-edXatd-gAEhkZAgTsNAFyb1GySt7NXP75IZn4ZPbCE8Zf0_5zQQ/exec"
        allowfullscreen></iframe>
    </section>
  </main>

  <script>
    const SEGUNDOS_ROTACION = 60;

    const pestanas = Array.from(document.querySelectorAll('.pestana'));
    const abrir = document.getElementById('abrir');
    const rotar = document.getElementById('rotar');
    let temporizador = null;

    function mostrar(i) {
      pestanas.forEach((tab, j) => {
        const panel = document.getElementById(tab.getAttribute('aria-controls'));
        const activo = i === j;
        tab.setAttribute('aria-selected', activo);
        panel.hidden = !activo;
        if (activo) {
          const frame = panel.querySelector('iframe');
          // Cada reporte se carga recién la primera vez que se abre: la página inicia más rápido
          if (!frame.src) frame.src = frame.dataset.src;
          abrir.href = frame.dataset.src.replace('/embed/reporting/', '/reporting/');
          history.replaceState(null, '', '#' + tab.id);
        }
      });
    }

    pestanas.forEach((tab, i) => tab.addEventListener('click', () => {
      mostrar(i);
      reiniciarRotacion();
    }));

    function reiniciarRotacion() {
      clearInterval(temporizador);
      if (rotar.checked) {
        temporizador = setInterval(() => {
          const actual = pestanas.findIndex(t => t.getAttribute('aria-selected') === 'true');
          mostrar((actual + 1) % pestanas.length);
        }, SEGUNDOS_ROTACION * 1000);
      }
    }
    rotar.addEventListener('change', reiniciarRotacion);

    // Abre la pestaña indicada en el link (ej. ...index.html#tab-2) o la primera
    const inicial = pestanas.findIndex(t => '#' + t.id === location.hash);
    mostrar(inicial >= 0 ? inicial : 0);
  </script>
</body>
</html>
